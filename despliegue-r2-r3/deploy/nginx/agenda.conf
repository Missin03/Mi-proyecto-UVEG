# Reto 3 - Configuración final: dominio local, HTTPS obligatorio y encabezados de seguridad.
# Las marcas __APP__, __LOCAL__ y __NGINX__ se sustituyen por rutas absolutas
# con scripts/entorno.py antes de iniciar Nginx.
worker_processes 1;
pid         __LOCAL__/nginx.pid;
error_log   __LOCAL__/logs/nginx-error.log;

events { worker_connections 128; }

http {
    include       __NGINX__/conf/mime.types;
    default_type  application/octet-stream;
    access_log    __LOCAL__/logs/nginx-access.log;
    sendfile      on;
    server_tokens off;
    gzip          on;
    gzip_types    text/css application/javascript application/json;

    upstream agenda_app { server 127.0.0.1:5055; }

    # Puerto 80: no entrega contenido, solo obliga a usar HTTPS.
    server {
        listen       127.0.0.1:80;
        server_name  agenda.local localhost;
        return 301   https://$host$request_uri;
    }

    server {
        listen       127.0.0.1:443 ssl;
        http2        on;
        server_name  agenda.local localhost;

        ssl_certificate      __LOCAL__/certificados/agenda.crt;
        ssl_certificate_key  __LOCAL__/certificados/agenda.key;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_session_cache    shared:SSL:1m;

        # Encabezados de seguridad (se aplican a todas las respuestas).
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location = / { return 302 /agenda/; }

        location /agenda/static/ {
            alias   __APP__/static/;
            expires 7d;
        }

        location /agenda/ {
            proxy_pass         http://agenda_app/;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_set_header   X-Forwarded-Host   $host;
            proxy_set_header   X-Forwarded-Prefix /agenda;
        }
    }
}
