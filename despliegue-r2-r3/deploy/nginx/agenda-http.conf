# Reto 2 - Server Block de Nginx (HTTP) para Agenda Académica.
# Las marcas __APP__, __LOCAL__ y __NGINX__ se sustituyen por rutas absolutas
# con scripts/entorno.py antes de iniciar Nginx.
worker_processes 1;
pid         __LOCAL__/nginx.pid;
error_log   __LOCAL__/logs/nginx-error.log;

events { worker_connections 128; }

http {
    include       __NGINX__/conf/mime.types;
    default_type  application/octet-stream;
    access_log    __LOCAL__/logs/nginx-access.log;
    sendfile      on;
    server_tokens off;
    gzip          on;
    gzip_types    text/css application/javascript application/json;

    # Aplicación Flask servida por Waitress solo en la interfaz local.
    upstream agenda_app { server 127.0.0.1:5055; }

    server {
        listen       127.0.0.1:80;           # puerto HTTP público de la práctica
        server_name  localhost agenda.local;

        # Ruta simulada: http://localhost/agenda/
        location = / { return 302 /agenda/; }

        # Mapeo de directorios: los estáticos optimizados se entregan directo desde disco.
        location /agenda/static/ {
            alias   __APP__/static/;
            expires 7d;
        }

        # El resto de /agenda/ se envía a la aplicación con el prefijo original.
        location /agenda/ {
            proxy_pass         http://agenda_app/;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_set_header   X-Forwarded-Host   $host;
            proxy_set_header   X-Forwarded-Prefix /agenda;
        }
    }
}
